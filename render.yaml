services:
  - type: web
    name: ymobile-shop-checker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - state.json
        - README.md
        - .github/**
