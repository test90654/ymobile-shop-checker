name: Ymobile shop availability

on:
  schedule:
    # 8:00〜20:59 JST に15分ごと（UTC 23:00〜11:59）
    - cron: "7,22,37,52 23 * * *"
    - cron: "7,22,37,52 0-11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        options: [normal, test, diagnose]
        default: normal

permissions:
  contents: write             # state.json をコミットするため

concurrency:
  group: ymobile-checker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check availability & notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          case "${{ inputs.mode }}" in
            test)     python notify.py --test ;;
            diagnose) python notify.py --diagnose ;;
            *)        python notify.py ;;
          esac

      - name: Save state
        if: inputs.mode != 'diagnose'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state $(TZ=Asia/Tokyo date '+%F %R')"
          git pull --rebase -q || true
          git push
